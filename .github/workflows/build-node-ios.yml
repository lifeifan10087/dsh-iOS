name: build-node-ios

on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: Node source ref (nodejs-mobile iOS-patched branch by default)
        default: update22-9-0
        required: true
      min_ios:
        description: Minimum iOS version
        default: "14.0"
        required: true
      probe:
        description: Only run toolchain diagnostics
        default: "0"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Node source + host tools
        uses: actions/cache@v4
        with:
          path: |
            work/node
            work/host
          key: node-ios-${{ inputs.node_ref }}-hosttools-v2

      - name: Preflight
        run: bash build/preflight.sh

      - name: Build Node for iOS arm64
        env:
          NODE_REF: ${{ inputs.node_ref }}
          NODE_VER: ${{ inputs.node_ref }}
          MIN_IOS: ${{ inputs.min_ios }}
          PROBE: ${{ inputs.probe }}
          WORK: ${{ github.workspace }}/work
          OUT: ${{ github.workspace }}/out
        run: bash build/build-node-ios.sh

      - name: Install signing tools
        run: brew install ldid || true

      - name: Patch Mach-O to iOS + sign
        run: |
          bash build/patch-macho-ios.sh out/node-ios-arm64 out/node-ios-patched || \
            cp out/node-ios-arm64 out/node-ios-patched

      - name: Bundle node_modules (darwin-arm64, patched to iOS)
        env:
          DSH_VER: "0.2.2-rc.1"
          OUT: ${{ github.workspace }}/out
        run: bash deploy/bundle-node-modules.sh

      - name: Show results
        run: |
          ls -lh out/ || true
          file out/node-ios-patched || true
          vtool -show-build out/node-ios-patched | head -12 || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-kit-${{ inputs.node_ref }}
          path: |
            out/node-ios-patched
            out/node_modules.tgz
          if-no-files-found: error
          retention-days: 14
