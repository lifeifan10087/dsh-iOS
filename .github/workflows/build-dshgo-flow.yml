name: build-dshgo-flow

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version (empty = latest stable)
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout upstream dsh-go
        uses: actions/checkout@v4
        with:
          repository: ccch1mneyyy/dsh-Go
          path: src

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Versions
        run: flutter --version

      - name: Pub get
        working-directory: src/app
        run: flutter pub get

      - name: Patch source (manual add-host entry + version bump)
        working-directory: src/app
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          # 1) 顶栏加一个「添加主机」按钮：绕开小屏上够不到的底部入口
          f = pathlib.Path('lib/ui/remote/remote_screen.dart')
          s = f.read_text()
          needle = "        const AskAiButton(AskAiTopic.remote),"
          inject = (
              "        GlassIconButton(\n"
              "          icon: AppIcons.add,\n"
              "          tooltip: '\\u6dfb\\u52a0 SSH \\u4e3b\\u673a',\n"
              "          onPressed: () => push(SshHostFormPage()),\n"
              "        ),\n"
          )
          if needle in s and "SshHostFormPage())" not in s.split("actions: [")[1][:800]:
              s = s.replace(needle, inject + needle, 1)
              f.write_text(s)
              print('remote_screen: 顶栏按钮已注入')
          else:
              print('remote_screen: 跳过（已存在或未匹配）')

          # 2) SSH 表单：把本机主机全部预填好（小屏上键盘挡字段，只能靠预填）
          f2 = pathlib.Path('lib/ui/remote/ssh_host_form.dart')
          s2 = f2.read_text()
          token = 'CLY_BlZtvB2U8d3-zBOVv5GxVFzk0A0aCNxe9MPy17A'
          reps = [
              ("final _name = TextEditingController(text: widget.existing?.name ?? '');",
               "final _name = TextEditingController(text: widget.existing?.name ?? '\\u672c\\u673a');"),
              ("final _host = TextEditingController(text: widget.existing?.host ?? '');",
               "final _host = TextEditingController(text: widget.existing?.host ?? '127.0.0.1');"),
              ("final _user = TextEditingController(text: widget.existing?.user ?? '');",
               "final _user = TextEditingController(text: widget.existing?.user ?? 'mobile');"),
              ("final _attachToken = TextEditingController();",
               f"final _attachToken = TextEditingController(text: '{token}');"),
              ("late SshDshMode _dshMode = widget.existing?.dshMode ?? SshDshMode.managed;",
               "late SshDshMode _dshMode = widget.existing?.dshMode ?? SshDshMode.attachOnly;"),
              ("late final _remotePort = TextEditingController(text: '${widget.existing?.remotePort ?? 3080}');",
               "late final _remotePort = TextEditingController(text: '${widget.existing?.remotePort ?? 3081}');"),
          ]
          hit = 0
          for a, b in reps:
              if a in s2:
                  s2 = s2.replace(a, b, 1); hit += 1
          f2.write_text(s2)
          print(f'ssh_host_form: 预填 {hit}/{len(reps)} 项')
          f2 = pathlib.Path('lib/ui/remote/ssh_host_form.dart')
          s2 = f2.read_text()
          token = 'CLY_BlZtvB2U8d3-zBOVv5GxVFzk0A0aCNxe9MPy17A'
          a = "final _attachToken = TextEditingController();"
          b = f"final _attachToken = TextEditingController(text: '{token}');"
          c = "late SshDshMode _dshMode = widget.existing?.dshMode ?? SshDshMode.managed;"
          d = "late SshDshMode _dshMode = widget.existing?.dshMode ?? SshDshMode.attachOnly;"
          if a in s2 and c in s2:
              s2 = s2.replace(a, b, 1).replace(c, d, 1)
              f2.write_text(s2)
              print('ssh_host_form: 令牌已预填，默认只连接')
          else:
              print('WARN: ssh_host_form 模式未命中')

          # 3) 版本号自增，保证 TrollStore 一定视为升级
          pub = pathlib.Path('pubspec.yaml')
          t = pub.read_text()
          m = re.search(r'^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)\s*$', t, re.M)
          if m:
              ma, mi, pa, b = map(int, m.groups())
              new = f'version: {ma}.{mi}.{pa + 1}+{b + 1}'
              t = t[:m.start()] + new + t[m.end():]
              pub.write_text(t)
              print('版本号 ->', new)
          else:
              print('WARN: 未找到版本行')
          PYEOF
          grep -n "version:" pubspec.yaml | head -2

      - name: Patch iOS layout (bottom padding for home indicator)
        working-directory: src/app
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          f = pathlib.Path('lib/ui/shell/page_frame.dart')
          s = f.read_text()
          before = s
          # 底部留白从「安全区 + 32」加到「安全区 + 120」，避免最后一项落在 Home 指示条手势区
          s = s.replace('SizedBox(height: padding.bottom + 32)',
                        'SizedBox(height: padding.bottom + 120)')
          if s == before:
              print('WARN: pattern not found, layout unchanged')
          f.write_text(s)
          print('patched page_frame.dart:', 'padding.bottom + 120' in s)
          PYEOF
          git diff --stat || true

      - name: Build iOS (no codesign)
        working-directory: src/app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: src/app/build/ios/iphoneos
        run: |
          ls -la
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qry DshGoFlow.ipa Payload
          du -h DshGoFlow.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: dshgo-flow-ipa
          path: src/app/build/ios/iphoneos/DshGoFlow.ipa
          if-no-files-found: error
