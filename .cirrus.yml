# Cirrus CI：开源仓库免费 macOS（Apple Silicon），不需要绑卡、不需要新 GitHub 账号
# 用法：GitHub 登录 cirrus-ci.org → 授权 → Add repository → 勾 dsh-ios
# 想直接出 IPA：在 Cirrus 上手动 Run 这个 workflow（或 push 带 [ipa] 的提交）
task:
  name: build-ipa
  macos_instance:
    image: ghcr.io/cirruslabs/macos-runner:sonoma
  timeout_in: 20m

  build_script:
    - xcodebuild -version || true
    - xcrun --sdk iphoneos --show-sdk-path
    - bash shell/build-ipa.sh
    - ls -lh out/DshGo.ipa
    - (brew install ldid && ldid -e Payload/DshGo.app/DshGo | head -20) || true

  artifacts:
    path: "out/DshGo.ipa"
